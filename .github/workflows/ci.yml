name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all
      - run: cargo clippy -- -D warnings

  docs:
    name: User docs (cli.kobana.com.br)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: user-docs/package-lock.json
      - run: cargo build --release
      - run: npm ci
        working-directory: user-docs
      # The manual is generated from the binary: fail when it is out of date.
      - run: npm run gen-manual:check
        working-directory: user-docs
      - run: npm run typecheck
        working-directory: user-docs
      - run: npm run build
        working-directory: user-docs

  build:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    env:
      # Signing (and notarizing) only on release commits; every other run
      # builds the same artifacts unsigned.
      SIGN: ${{ github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: kobana-linux-amd64
            nfpm_arch: amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: kobana-linux-arm64
            nfpm_arch: arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: kobana-darwin-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: kobana-darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: kobana-windows-amd64.exe

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Cross-compilation toolchain for Linux ARM64
      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/kobana ${{ matrix.artifact }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: cp target/${{ matrix.target }}/release/kobana.exe ${{ matrix.artifact }}

      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS' && env.SIGN == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::Apple signing not configured - macOS binary is unsigned"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

          # Hardened runtime + secure timestamp are what notarization requires.
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "${{ matrix.artifact }}"
          codesign --verify --strict --verbose=2 "${{ matrix.artifact }}"

          # A bare executable cannot be stapled: Gatekeeper checks the ticket online.
          ditto -c -k --keepParent "${{ matrix.artifact }}" "$RUNNER_TEMP/notarize.zip"
          OUT="$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --wait --output-format json)"
          echo "$OUT"
          echo "$OUT" | grep -q '"status" *: *"Accepted"' || { echo "::error::notarization was not accepted"; exit 1; }

      - name: Remove signing keychain (macOS)
        if: always() && runner.os == 'macOS' && env.SIGN == 'true'
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true

      - name: Install AzureSignTool (Windows)
        if: runner.os == 'Windows' && env.SIGN == 'true'
        shell: bash
        run: |
          dotnet tool install --global AzureSignTool
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # EV code-signing certificate in Azure Key Vault, same setup as kia-desktop.
      - name: Sign (Windows)
        if: runner.os == 'Windows' && env.SIGN == 'true'
        shell: pwsh
        env:
          AZURE_KV_URL: ${{ secrets.AZURE_KV_URL }}
          AZURE_KV_CERT_NAME: ${{ secrets.AZURE_KV_CERT_NAME }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SIGN_TS_URL: ${{ secrets.AZURE_SIGN_TS_URL }}
        run: |
          if (-not $env:AZURE_CLIENT_ID -or -not $env:AZURE_KV_CERT_NAME) {
            Write-Host "::warning::Windows signing not configured - binary is unsigned"
            exit 0
          }
          ./scripts/azure-sign.ps1 -File "${{ matrix.artifact }}"
          $sig = Get-AuthenticodeSignature "${{ matrix.artifact }}"
          if ($sig.Status -ne 'Valid') { throw "signature is $($sig.Status)" }

      # .deb and .rpm are built on every run so packaging breakage shows up
      # before a release; they are signed and published by the release job.
      - name: Package (.deb, .rpm)
        if: runner.os == 'Linux'
        run: |
          VERSION=$(grep '^version' crates/kobana-cli/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          NFPM_VERSION=2.48.0
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" | tar xz nfpm
          mkdir -p dist pkgs
          cp ${{ matrix.artifact }} dist/kobana
          for fmt in deb rpm; do
            NFPM_ARCH=${{ matrix.nfpm_arch }} VERSION="$VERSION" ./nfpm package -p $fmt -f packaging/nfpm.yaml -t pkgs/
          done
          ls -l pkgs

      - name: Upload packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v5
        with:
          name: pkgs-${{ matrix.target }}
          path: pkgs/*

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:')
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    outputs:
      site_built: ${{ steps.repo.outputs.built }}
    steps:
      - uses: actions/checkout@v5

      - name: Get version
        id: version
        run: |
          VERSION=$(grep '^version' crates/kobana-cli/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=v${VERSION}" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      # Signs the .rpm files in place and builds the apt/dnf/zypper site, so the
      # attested and released rpm are the signed ones.
      - name: Sign packages and build apt/dnf repos
        id: repo
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::warning::GPG_PRIVATE_KEY not set - Linux packages are unsigned and no repo is published"
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y createrepo-c rpm dpkg-dev apt-utils gnupg
          bash scripts/publish-linux-repo.sh artifacts
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            artifacts/*/kobana-*
            artifacts/*/kobana_*

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Kobana CLI ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: artifacts/**/*

      - name: Update Homebrew tap
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Compute SHA256 for each binary
          SHA_DARWIN_ARM64=$(shasum -a 256 artifacts/kobana-darwin-arm64/kobana-darwin-arm64 | cut -d' ' -f1)
          SHA_DARWIN_AMD64=$(shasum -a 256 artifacts/kobana-darwin-amd64/kobana-darwin-amd64 | cut -d' ' -f1)
          SHA_LINUX_ARM64=$(shasum -a 256 artifacts/kobana-linux-arm64/kobana-linux-arm64 | cut -d' ' -f1)
          SHA_LINUX_AMD64=$(shasum -a 256 artifacts/kobana-linux-amd64/kobana-linux-amd64 | cut -d' ' -f1)

          # Generate formula
          cat > /tmp/kobana.rb << FORMULA
          class Kobana < Formula
            desc "CLI for the Kobana financial API (v1 and v2)"
            homepage "https://github.com/universokobana/kobana-cli"
            version "${VERSION#v}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/universokobana/kobana-cli/releases/download/${VERSION}/kobana-darwin-arm64"
                sha256 "${SHA_DARWIN_ARM64}"
              end
              on_intel do
                url "https://github.com/universokobana/kobana-cli/releases/download/${VERSION}/kobana-darwin-amd64"
                sha256 "${SHA_DARWIN_AMD64}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/universokobana/kobana-cli/releases/download/${VERSION}/kobana-linux-arm64"
                sha256 "${SHA_LINUX_ARM64}"
              end
              on_intel do
                url "https://github.com/universokobana/kobana-cli/releases/download/${VERSION}/kobana-linux-amd64"
                sha256 "${SHA_LINUX_AMD64}"
              end
            end

            def install
              bin.install stable.url.split("/").last => "kobana"
            end

            test do
              assert_match "kobana", shell_output("#{bin}/kobana --version")
            end
          end
          FORMULA

          # Push to homebrew-tap repo
          git clone https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/universokobana/homebrew-tap.git /tmp/homebrew-tap
          cp /tmp/kobana.rb /tmp/homebrew-tap/Formula/kobana.rb
          cd /tmp/homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/kobana.rb
          git commit -m "update kobana to ${VERSION}" || echo "No changes"
          git push

      # Opens the PR on microsoft/winget-pkgs. Only updates a package that is
      # already there: submit the first version by hand (wingetcreate new).
      - name: Update WinGet package
        if: env.WINGET_TOKEN != ''
        continue-on-error: true
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Kobana.CLI
          release-tag: ${{ steps.version.outputs.version }}
          installers-regex: 'windows-amd64\.exe$'
          fork-user: universokobana
          token: ${{ env.WINGET_TOKEN }}

      - name: Upload Pages artifact
        if: steps.repo.outputs.built == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  # apt/dnf/zypper repositories at https://<owner>.github.io/<repo>/
  deploy-pages:
    name: Deploy package repositories
    needs: release
    if: needs.release.outputs.site_built == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
