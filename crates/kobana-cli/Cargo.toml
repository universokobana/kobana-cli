[package]
name = "kobana-cli"
version = "0.15.0"
edition = "2021"
default-run = "kobana"

[[bin]]
name = "kobana"
path = "src/main.rs"

[dependencies]
kobana = { path = "../kobana" }
clap = { version = "4", features = ["derive", "string"] }
clap_complete = "4"
reqwest = { version = "0.12", features = ["stream", "json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "5"
dotenvy = "0.15"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = "0.4"
comfy-table = "7"
csv = "1"
aes-gcm = "0.10"
sha2 = "0.10"
keyring = "3"
zeroize = "1"
base64 = "0.22"
rand = "0.9"
inquire = "0.7"
# `--jq`: jq expressions run in-process, like `gh --jq` (no jq needed on the machine)
jaq-core = "3"
jaq-std = "3"
jaq-json = "2"
# The color rules clap uses (anstream), and Windows console ANSI support
anstyle-query = "1"
# `kobana art`, `oi` and `kadu <TEXTO>`: the window size, the width of a text
# and how near a word is to a command. All already come in through comfy-table
# and clap.
crossterm = { version = "0.29", default-features = false }
unicode-width = "0.2"
strsim = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
crossterm = { version = "0.29", default-features = false, features = ["windows"] }
